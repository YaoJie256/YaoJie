<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YaoJie · Message Board</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="card">
      <header>
        <h1>YaoJie</h1>
        <p class="subtitle">A minimal starter demonstrating the dev environment.</p>
        <span id="health" class="badge">checking…</span>
      </header>

      <form id="message-form" autocomplete="off">
        <input
          id="message-input"
          name="text"
          type="text"
          placeholder="Write a message and press Add"
          maxlength="280"
          required
        />
        <button type="submit">Add</button>
      </form>

      <ul id="messages" class="messages"></ul>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
